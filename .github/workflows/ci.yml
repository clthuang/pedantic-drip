name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version and CHANGELOG checks read tags and the base branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run validation
        run: ./validate.sh

      - name: Run hook tests
        run: bash plugins/pd/hooks/tests/test-hooks.sh

      - name: Run release script tests
        run: bash scripts/test-release.sh

      - name: Released CHANGELOG sections unchanged
        if: github.event_name == 'pull_request'
        run: bash scripts/check-changelog.sh "origin/$GITHUB_BASE_REF"
