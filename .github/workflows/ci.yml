name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version and CHANGELOG checks read tags and the base branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run validation
        run: ./validate.sh

      - name: Run hook tests
        run: bash plugins/pd/hooks/tests/test-hooks.sh

      - name: Run release script tests
        run: bash scripts/test-release.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run pd's script, hook and workflow suites
        run: |
          set -e
          for t in plugins/pd/hooks/tests/test-pd-*.sh plugins/pd/scripts/test-phase-gate.sh; do bash "$t"; done
          for s in pd-adopt pd-init pd-lint pd-new pd-proof pd-review-filter pd-status; do "plugins/pd/scripts/$s" --self-test; done
          python3 plugins/pd/scripts/pd_common.py --self-test
          uv run --script plugins/pd/scripts/pd-html.py --self-test
          node plugins/pd/workflows/tests/test-workflows.mjs
          uv run --project plugins/pd pytest -q plugins/pd/hooks/tests/test_pre_edit_unicode_guard.py plugins/pd/hooks/lib/test_project_root.py

      - name: Released CHANGELOG sections unchanged
        if: github.event_name == 'pull_request'
        run: bash scripts/check-changelog.sh "origin/$GITHUB_BASE_REF"
