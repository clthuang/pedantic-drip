name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version and CHANGELOG checks read tags and the base branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run the test battery
        run: bash scripts/test-all.sh

      - name: Released CHANGELOG sections unchanged
        if: github.event_name == 'pull_request'
        run: bash scripts/check-changelog.sh "origin/$GITHUB_BASE_REF"

  # On each push to main, once validate has passed on that commit: tags vX.Y.Z on the commit where
  # plugin.json's version became X.Y.Z and fast-forwards stable, the branch the marketplace follows
  # (scripts/publish-release.sh). Between releases it does nothing. Only the release commit's own run
  # publishes it, so a release whose CI failed stays unpublished until that run is re-run. The same holds
  # if a newer push's pending publish replaces the release's: the newer run fails and names the commit.
  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish
      cancel-in-progress: false  # a running publish finishes; a newer pending one replaces an older pending one
    permissions:
      contents: write  # push the tag and stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # first-parent history, tags and stable

      - name: Tag the release and move stable
        run: bash scripts/publish-release.sh "$GITHUB_SHA"
